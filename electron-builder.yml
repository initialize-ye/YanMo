appId: com.yanmo.app
productName: YanMo
copyright: Copyright © 2026 YanMo

directories:
  output: dist-electron
  buildResources: build

files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

extraResources:
  - from: .next/standalone
    to: server

afterPack: scripts/after-pack.cjs

asar: true
compression: maximum
npmRebuild: false

electronLanguages:
  - zh-CN
  - en-US

win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: YanMo-${version}-win64.${ext}

portable:
  artifactName: YanMo-${version}-win64.${ext}
  requestExecutionLevel: user
