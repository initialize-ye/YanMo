name: Build Windows Exe

on:
  # 每次 push 都构建桌面版 exe（任意分支/标签）
  push:
  workflow_dispatch:

permissions:
  contents: write

# 每次 push 都各自构建：不取消进行中的构建，多个 push 会依次排队执行，产物各自保留
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Ensure Electron runtime
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node node_modules/electron/install.js

      - name: Prepare standalone assets
        run: npm run prepare:standalone

      - name: Build Electron exe
        shell: powershell
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win portable --config electron-builder.yml

      - name: Generate update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $base = "${{ vars.YANMO_PUBLIC_URL }}"
          if ([string]::IsNullOrWhiteSpace($base)) {
            $base = "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
            $url = "$($base.TrimEnd('/'))/YanMo-$version-win64.exe"
          } else {
            $url = "$($base.TrimEnd('/'))/downloads/YanMo-$version-win64.exe"
          }
          $manifest = [ordered]@{
            version     = $version
            url         = $url
            notes       = "见 Release ${{ github.ref_name }}"
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 dist-electron/latest.json
          Get-Content dist-electron/latest.json

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: yanmo-windows-exe
          path: dist-electron/YanMo-*-win64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/YanMo-*-win64.exe
            dist-electron/latest.json
          generate_release_notes: true
