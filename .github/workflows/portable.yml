name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-portable.ps1

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: yanmo-portable-win64
          path: dist/yanmo-portable-win64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/yanmo-portable-win64.zip
          generate_release_notes: true
