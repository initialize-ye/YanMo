name: Build Windows Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-portable.ps1

      - name: Ensure Electron runtime
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node node_modules/electron/install.js

      - name: Prepare standalone assets
        run: npm run prepare:standalone

      - name: Build Electron exe
        shell: powershell
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --win portable --config electron-builder.yml

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: yanmo-windows
          path: |
            dist/yanmo-portable-win64.zip
            dist-electron/YanMo-*-win64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yanmo-portable-win64.zip
            dist-electron/YanMo-*-win64.exe
          generate_release_notes: true
