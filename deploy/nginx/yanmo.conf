# 研墨 AI —— Nginx 站点配置
# 放置到 /etc/nginx/sites-available/yanmo.conf，并软链到 sites-enabled。
# 把 your-domain.example.com 换成你的域名；无域名时删掉 listen 443 段，改用 :8080 验收。

# ---- 限流：保护服务端 AI Key，防止被刷 ----
limit_req_zone $binary_remote_addr zone=yanmo_api:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=yanmo_auth:10m rate=10r/m;

# ---- 上游：Next standalone（由 systemd 拉起，仅监听 127.0.0.1:3000）----
upstream yanmo_upstream {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP 跳转 HTTPS（无域名验收时可注释掉整段 server）
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # certbot 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example.com;

    # certbot --nginx 会自动写入下面两行；手动部署时替换为你的证书路径
    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 手写作文照片以 base64 提交，放宽请求体上限
    client_max_body_size 12m;

    # ---- 登录/注册：防爆破限流 ----
    location ~ ^/api/auth/(login|register) {
        limit_req zone=yanmo_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://yanmo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- AI 接口：限流 + 长超时（AI 处理最长 120s）----
    location ~ ^/api/(grade|ocr|topic|ai/test) {
        limit_req zone=yanmo_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://yanmo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---- Next 静态资源：长缓存（文件名带 hash）----
    location /_next/static/ {
        proxy_pass http://yanmo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 其他请求全部交给 Next ----
    location / {
        proxy_pass http://yanmo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}


